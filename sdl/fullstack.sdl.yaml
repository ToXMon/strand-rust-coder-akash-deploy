version: "2.0"

services:
  rustcoder-model:
    image: vllm/vllm-openai:v0.6.3.post1
    command:
      - "/bin/sh"
      - "-lc"
      - "python3 -m vllm.entrypoints.openai.api_server --model Fortytwo-Network/Strand-Rust-Coder-14B-v1 --served-model-name Fortytwo-Network/Strand-Rust-Coder-14B-v1 --host 0.0.0.0 --port 8000 --dtype bfloat16 --max-model-len 8192 --gpu-memory-utilization 0.92 --trust-remote-code"
    env:
      - "HF_HUB_ENABLE_HF_TRANSFER=1"
      # Optional if model requires gated access token
      # - "HUGGING_FACE_HUB_TOKEN=hf_xxx"
    expose:
      - port: 8000
        to:
          - service: rustcoder-api

  rustcoder-api:
    image: wijnaldum/rustcoder-api:0.1.1
    env:
      - "RUSTCODER_BIND=0.0.0.0:8080"
      - "RUSTCODER_INFERENCE_BASE_URL=http://rustcoder-model:8000/v1"
      - "RUSTCODER_INFERENCE_MODEL=Fortytwo-Network/Strand-Rust-Coder-14B-v1"
      - "RUSTCODER_INFERENCE_API_KEY=placeholder"
      - "RUST_LOG=info"
    expose:
      - port: 8080
        to:
          - service: rustcoder-web

  rustcoder-web:
    image: wijnaldum/rustcoder-web:0.1.1
    expose:
      - port: 80
        as: 80
        to:
          - global: true

profiles:
  compute:
    rustcoder-model:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi
        storage:
          - size: 120Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100

    rustcoder-api:
      resources:
        cpu:
          units: 4
        memory:
          size: 4Gi
        storage:
          size: 5Gi

    rustcoder-web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 256Mi
        storage:
          size: 1Gi

  placement:
    akash:
      pricing:
        rustcoder-model:
          denom: uakt
          amount: 25000
        rustcoder-api:
          denom: uakt
          amount: 12000
        rustcoder-web:
          denom: uakt
          amount: 3000

deployment:
  rustcoder-model:
    akash:
      profile: rustcoder-model
      count: 1

  rustcoder-api:
    akash:
      profile: rustcoder-api
      count: 1

  rustcoder-web:
    akash:
      profile: rustcoder-web
      count: 1
