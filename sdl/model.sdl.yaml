version: "2.0"

services:
  rustcoder-model:
    image: vllm/vllm-openai:v0.6.3.post1
    args:
      - "--model"
      - "Fortytwo-Network/Strand-Rust-Coder-14B-v1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--trust-remote-code"
    env:
      - "HF_HUB_ENABLE_HF_TRANSFER=1"
      # Optional if model requires gated access token
      # - "HUGGING_FACE_HUB_TOKEN=hf_xxx"
    expose:
      - port: 8000
        as: 8000
        to:
          - global: true

profiles:
  compute:
    rustcoder-model:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi
        storage:
          - size: 120Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: a100

  placement:
    akash:
      pricing:
        rustcoder-model:
          denom: uakt
          amount: 25000

deployment:
  rustcoder-model:
    akash:
      profile: rustcoder-model
      count: 1
