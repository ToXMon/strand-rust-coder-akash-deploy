version: "2.0"

services:
  rustcoder-api:
    image: wijnaldum/rustcoder-api:0.1.0
    expose:
      - port: 8080
        to:
          - service: rustcoder-web
    env:
      - "RUSTCODER_BIND=0.0.0.0:8080"
      - "RUSTCODER_INFERENCE_BASE_URL=http://<your-model-lease-uri>/v1"
      - "RUSTCODER_INFERENCE_MODEL=Fortytwo-Network/Strand-Rust-Coder-14B-v1"
      - "RUSTCODER_INFERENCE_API_KEY=placeholder"
      - "RUST_LOG=info"

  rustcoder-web:
    image: wijnaldum/rustcoder-web:0.1.0
    expose:
      - port: 80
        as: 80
        to:
          - global: true

profiles:
  compute:
    rustcoder-api:
      resources:
        cpu:
          units: 2
        memory:
          size: 2Gi
        storage:
          size: 5Gi
    rustcoder-web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 256Mi
        storage:
          size: 1Gi

  placement:
    akash:
      pricing:
        rustcoder-api:
          denom: uakt
          amount: 12000
        rustcoder-web:
          denom: uakt
          amount: 3000

deployment:
  rustcoder-api:
    akash:
      profile: rustcoder-api
      count: 1
  rustcoder-web:
    akash:
      profile: rustcoder-web
      count: 1
